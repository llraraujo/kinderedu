<div class="page-container">

  <nav class="top-nav">
    <a routerLink="/dashboard" class="back-link">
      <span class="material-icons-outlined">arrow_back</span>
    </a>
    <span class="material-icons-outlined page-icon">menu_book</span>
    <span class="page-title">Turmas</span>
  </nav>

  <header class="page-header">
    <div>
      <h1>Gerenciar Turmas</h1>
      <p>{{ turmas.length }} turma(s) cadastrada(s)</p>
    </div>
    <button class="btn-primary" (click)="openDialog()">
      <span class="material-icons-outlined">add</span> Nova Turma
    </button>
  </header>

  <main class="content-area">

    @if (!isLoading && turmas.length === 0) {
      <div class="empty-state">
        <span class="material-icons-outlined empty-icon">menu_book</span>
        <h3>Nenhuma turma cadastrada</h3>
        <p>Clique em "Nova Turma" para começar</p>
      </div>
    }

    @if (turmas.length > 0) {
      <div class="turmas-grid">
      </div>
    }
  </main>

  @if (isModalOpen) {
    <app-turma-dialog
      (closeDialog)="closeDialog()"
      (saveTurma)="onSalvarTurma($event)">
    </app-turma-dialog>
  }
</div>
