<div class="page-container">

  <nav class="top-nav">
    <a routerLink="/dashboard" class="back-link">
      <span class="material-icons-outlined">arrow_back</span>
    </a>
    <span class="material-icons-outlined page-icon">school</span>
    <span class="page-title">Professores</span>
  </nav>

  <header class="page-header">
    <div class="header-info">
      <p>{{ professores.length }} professor(es) cadastrado(s)</p>
    </div>
    <button class="btn-primary" (click)="openDialog()">
      <span class="material-icons-outlined">add</span> Novo Professor
    </button>
  </header>

  <main class="content-area">

    @if (!isLoading && professores.length === 0) {
      <div class="empty-state">
        <span class="material-icons-outlined empty-icon">school</span>
        <h3>Nenhum professor cadastrado</h3>
        <p>Clique em "Novo Professor" para começar</p>
      </div>
    }

    @if (professores.length > 0) {
      <div class="professores-grid">
      </div>
    }
  </main>

  @if (isModalOpen) {
    <app-professor-dialog
      (closeDialog)="closeDialog()"
      (saveProfessor)="onSalvarProfessor($event)">
    </app-professor-dialog>
  }
</div>
